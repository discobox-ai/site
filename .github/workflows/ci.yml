name: CI

# Type-check and build every pull request. Pushes to main and preview are
# covered by deploy.yml, which runs the same `pnpm check` and `pnpm build`
# before it deploys, so they are deliberately not duplicated here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # .node-version is the single source of truth: deploy.yml reads the
      # same file, so the checked build and the deployed build stay on one
      # version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build
