name: CI

# Type-check and build every pull request. Cloudflare Workers Builds handles
# builds and deployments for pushes to main and preview through its git integration.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # Keep Cloudflare Workers Builds settings aligned with .node-version
      # and packageManager in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test:blog

      - run: pnpm build
        env:
          SITE_PREVIEW: true
